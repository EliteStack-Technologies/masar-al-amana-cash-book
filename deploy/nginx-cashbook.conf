# Nginx site for Cash Book. Replace DOMAIN, API_PORT (PORT in backend/.env)
# and WEB_PORT (the WEB_PORT GitHub variable) with your values, then:
#   sudo cp deploy/nginx-cashbook.conf /etc/nginx/sites-available/cashbook
#   sudo ln -s /etc/nginx/sites-available/cashbook /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d DOMAIN --redirect     # adds HTTPS to this file
#
# One domain for both apps, so the login cookie is same-site:
#   https://DOMAIN/api/...  -> Express API on API_PORT
#   https://DOMAIN/...      -> Next.js on WEB_PORT

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://127.0.0.1:API_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Report PDFs / Excel files can take a moment to build.
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:WEB_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
